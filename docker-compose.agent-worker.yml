services:
  agent-worker:
    build:
      context: ..
      dockerfile: omicsprism-platform/Dockerfile.backend
    image: omicsprism-agent-worker:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${AGENT_ENV_FILE:-.env.agent}
    command: python -m backend.agent_worker
    init: true
    stop_grace_period: 30s
