version: "3.9"

services:
  # ===== 基础设施 =====
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: omicsprism
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omicsprism"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?Set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 初始化：自动创建 bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER:?Set MINIO_USER in .env} ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env};
      mc mb -p local/omicsprism || true;
      "

  # Schema migration runs with the admin identity. API and worker never receive it.
  migrate:
    build:
      context: ..
      dockerfile: omicsprism-platform/Dockerfile.backend
    profiles: ["migration"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OMICS_PRISM_MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/omicsprism
      OMICS_PRISM_APP_DB_PASSWORD: ${OMICS_APP_DB_PASSWORD:?Set OMICS_APP_DB_PASSWORD in .env}
    command: python scripts/migrate.py

  # ===== 应用服务 =====
  api:
    build:
      context: ..
      dockerfile: omicsprism-platform/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-18086}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 存储后端
      OMICS_PRISM_STORAGE_BACKEND: postgres
      OMICS_PRISM_RUNTIME_DATABASE_URL: postgresql://omics_app:${OMICS_APP_DB_PASSWORD:?Set OMICS_APP_DB_PASSWORD in .env}@postgres:5432/omicsprism
      # 任务执行
      OMICS_PRISM_EXECUTOR: redis
      OMICS_PRISM_REDIS_URL: redis://redis:6379/0
      OMICS_PRISM_REDIS_QUEUE: omicsprism:jobs
      # 文件存储
      OMICS_PRISM_FILE_STORAGE_BACKEND: s3
      OMICS_PRISM_S3_ENDPOINT_URL: http://minio:9000
      OMICS_PRISM_S3_REGION: us-east-1
      OMICS_PRISM_S3_ACCESS_KEY_ID: ${MINIO_USER:?Set MINIO_USER in .env}
      OMICS_PRISM_S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
      OMICS_PRISM_FILE_STORAGE_BUCKET: omicsprism
      OMICS_PRISM_FILE_STORAGE_PREFIX: jobs
      # 运行目录
      OMICS_PRISM_RUNS_DIR: /app/data/runs
      OMICS_PRISM_FILE_STORAGE_ROOT: /app/data/storage
      OMICS_PRISM_JOB_HISTORY_TTL_HOURS: ${JOB_HISTORY_TTL_HOURS:-24}
      # 认证（开发模式，后续需要改为真正的认证）
      OMICS_PRISM_DEV_EMAIL: ${DEV_EMAIL:-admin@omicsprism.local}
      OMICS_PRISM_DEV_PASSWORD: ${DEV_PASSWORD:-changeme}
      # 日志
      OMICS_PRISM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - app_data:/app/data
    command: >
      python -m uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4

  worker:
    build:
      context: ..
      dockerfile: omicsprism-platform/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OMICS_PRISM_STORAGE_BACKEND: postgres
      OMICS_PRISM_RUNTIME_DATABASE_URL: postgresql://omics_app:${OMICS_APP_DB_PASSWORD:?Set OMICS_APP_DB_PASSWORD in .env}@postgres:5432/omicsprism
      OMICS_PRISM_EXECUTOR: redis
      OMICS_PRISM_REDIS_URL: redis://redis:6379/0
      OMICS_PRISM_REDIS_QUEUE: omicsprism:jobs
      OMICS_PRISM_FILE_STORAGE_BACKEND: s3
      OMICS_PRISM_S3_ENDPOINT_URL: http://minio:9000
      OMICS_PRISM_S3_REGION: us-east-1
      OMICS_PRISM_S3_ACCESS_KEY_ID: ${MINIO_USER:?Set MINIO_USER in .env}
      OMICS_PRISM_S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
      OMICS_PRISM_FILE_STORAGE_BUCKET: omicsprism
      OMICS_PRISM_FILE_STORAGE_PREFIX: jobs
      OMICS_PRISM_RUNS_DIR: /app/data/runs
      OMICS_PRISM_FILE_STORAGE_ROOT: /app/data/storage
      OMICS_PRISM_JOB_HISTORY_TTL_HOURS: ${JOB_HISTORY_TTL_HOURS:-24}
      OMICS_PRISM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - app_data:/app/data
    command: python -m backend.worker

  housekeeping:
    build:
      context: ..
      dockerfile: omicsprism-platform/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      OMICS_PRISM_STORAGE_BACKEND: postgres
      OMICS_PRISM_RUNTIME_DATABASE_URL: postgresql://omics_app:${OMICS_APP_DB_PASSWORD:?Set OMICS_APP_DB_PASSWORD in .env}@postgres:5432/omicsprism
      OMICS_PRISM_FILE_STORAGE_BACKEND: s3
      OMICS_PRISM_S3_ENDPOINT_URL: http://minio:9000
      OMICS_PRISM_S3_REGION: us-east-1
      OMICS_PRISM_S3_ACCESS_KEY_ID: ${MINIO_USER:?Set MINIO_USER in .env}
      OMICS_PRISM_S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
      OMICS_PRISM_FILE_STORAGE_BUCKET: omicsprism
      OMICS_PRISM_FILE_STORAGE_PREFIX: jobs
      OMICS_PRISM_RUNS_DIR: /app/data/runs
      OMICS_PRISM_FILE_STORAGE_ROOT: /app/data/storage
      OMICS_PRISM_JOB_HISTORY_TTL_HOURS: ${JOB_HISTORY_TTL_HOURS:-24}
      OMICS_PRISM_HOUSEKEEPING_INTERVAL_SECONDS: ${HOUSEKEEPING_INTERVAL_SECONDS:-3600}
      OMICS_PRISM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - app_data:/app/data
    command: python -m backend.housekeeping

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app_data:
