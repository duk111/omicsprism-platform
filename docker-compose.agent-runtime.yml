services:
  agent-runtime:
    build:
      context: ..
      dockerfile: omicsprism-platform/Dockerfile.backend
    restart: unless-stopped
    network_mode: host
    environment:
      OMICS_PRISM_STORAGE_BACKEND: postgres
      OMICS_PRISM_RUNTIME_DATABASE_URL: ${OMICS_PRISM_RUNTIME_DATABASE_URL:?Set OMICS_PRISM_RUNTIME_DATABASE_URL in .env}
      OMICS_PRISM_EXECUTOR: redis
      OMICS_PRISM_REDIS_URL: ${OMICS_PRISM_REDIS_URL:?Set OMICS_PRISM_REDIS_URL in .env}
      OMICS_PRISM_REDIS_QUEUE: ${OMICS_PRISM_REDIS_QUEUE:-omicsprism:jobs}
      OMICS_PRISM_AGENT_QUEUE: ${OMICS_PRISM_AGENT_QUEUE:-omicsprism:agent-turns}
      OMICS_PRISM_AGENT_MODEL_URL: ${OMICS_PRISM_AGENT_MODEL_URL:-http://127.0.0.1:18000/v1}
      OMICS_PRISM_AGENT_MODEL_NAME: ${OMICS_PRISM_AGENT_MODEL_NAME:?Set OMICS_PRISM_AGENT_MODEL_NAME in .env}
      OMICS_PRISM_AGENT_MODEL_API_KEY: ${OMICS_PRISM_AGENT_MODEL_API_KEY:-}
      OMICS_PRISM_JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-7200}
      OMICS_PRISM_FILE_STORAGE_BACKEND: s3
      OMICS_PRISM_S3_ENDPOINT_URL: ${OMICS_PRISM_S3_ENDPOINT_URL:?Set OMICS_PRISM_S3_ENDPOINT_URL in .env}
      OMICS_PRISM_S3_REGION: ${OMICS_PRISM_S3_REGION:-us-east-1}
      OMICS_PRISM_S3_ACCESS_KEY_ID: ${OMICS_PRISM_S3_ACCESS_KEY_ID:?Set OMICS_PRISM_S3_ACCESS_KEY_ID in .env}
      OMICS_PRISM_S3_SECRET_ACCESS_KEY: ${OMICS_PRISM_S3_SECRET_ACCESS_KEY:?Set OMICS_PRISM_S3_SECRET_ACCESS_KEY in .env}
      OMICS_PRISM_FILE_STORAGE_BUCKET: ${OMICS_PRISM_FILE_STORAGE_BUCKET:-omicsprism}
      OMICS_PRISM_FILE_STORAGE_PREFIX: ${OMICS_PRISM_FILE_STORAGE_PREFIX:-jobs}
      OMICS_PRISM_RUNS_DIR: /app/data/runs
      OMICS_PRISM_FILE_STORAGE_ROOT: /app/data/storage
      OMICS_PRISM_LOG_LEVEL: ${OMICS_PRISM_LOG_LEVEL:-INFO}
    volumes:
      - app_data:/app/data
    command: python -m backend.agent_runtime

volumes:
  app_data:
